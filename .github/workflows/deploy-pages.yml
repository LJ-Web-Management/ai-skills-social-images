name: Deploy to GitHub Pages

# Deploys the repository contents to GitHub Pages.
# Image pushes are handled by publish-social-image.yml, which calls this workflow and then posts
# to Instagram/Facebook, so image and state-file paths are ignored here to avoid a second deploy.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "images/**.jpg"
      - "images/**.jpeg"
      - "images/**.png"
      - "images/**.JPG"
      - "images/**.JPEG"
      - "images/**.PNG"
      - ".github/state/**"
  workflow_dispatch:
  workflow_call:
    outputs:
      page_url:
        description: Public base URL of the deployed GitHub Pages site
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One Pages deployment at a time across all workflows; queue instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
